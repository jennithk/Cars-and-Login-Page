<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Form Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #000;
            color: #F5F5F5;
            font-family: sans-serif;
            padding: 20px;
            font-size: 1.1rem;
        }
        
        .form-container {
            background-color: #1E1E1E;
            border-radius: 12px;
            padding: 40px;
            display: flex;
            flex-wrap: wrap;
            max-width: 1000px;
            width: 100%;
        }
        
        form label,
        form .form-check-label {
            color: #F5F5F5;
        }
        
        form .form-control {
            background-color: #2A2A2A;
            color: #F5F5F5;
            border: 1px solid #444;
            padding: 12px 15px;
            font-size: 1.1rem;
        }
        
        form .form-control:focus {
            border-color: #FFBA08;
            box-shadow: 0 0 6px rgba(255, 186, 8, 0.6);
        }
        
        form .btn {
            background-color: #FFBA08;
            color: #1E1E1E;
            font-weight: 600;
            padding: 12px 25px;
            font-size: 1.1rem;
        }
        
        form .btn:hover {
            background-color: #D72638;
            color: #fff;
        }
        
        .form-image img {
            width: 100%;
            height: auto;
            max-height: 600px;
            border-radius: 12px;
            margin: auto;
        }
    </style>
</head>

<body>
    <div class="d-flex justify-content-center align-items-center" style="min-height:100vh;">
        <div class="form-container">
            <form class="col-12 col-md-6 pe-md-4">
                <div class="mb-3">
                    <button type="button" class="btn mb-3" onclick="history.back()">Back</button>
                </div>
                <div class="mb-3">
                    <label for="exampleInputName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="exampleInputName" autocomplete="name">
                </div>
                <div class="mb-3">
                    <label for="exampleInputMobile" class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control" id="exampleInputMobile" autocomplete="tel">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label for="exampleInputConfirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="exampleInputConfirmPassword" autocomplete="new-password">
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
            <div class="col-12 col-md-6 d-flex justify-content-center align-items-center form-image">
                <img src="https://64.media.tumblr.com/a26e76dc3a9d15f6c16f09ca52537341/234cfc7027abe537-d4/s400x600/823bd72077b05150e027b6b4da1b15f15a54d273.gif" alt="Form Illustration">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>

</html>
